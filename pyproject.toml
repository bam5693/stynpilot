[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stynpilot"
version = "0.1.0.dev0"
description = "Owner-controlled Linux automation and multi-assistant coordination"
readme = "README.md"
requires-python = ">=3.11"
# The core is standard-library only on purpose: fewer supply-chain risks and
# nothing to download on the Ryzen or the Pi before the core can run.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
